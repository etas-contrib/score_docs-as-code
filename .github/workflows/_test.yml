name: Run Bazel Tests
on:
  workflow_call:
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Harden Runner
        if: github.repository_owner == 'eclipse-score'
        uses: step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - name: Install Graphviz
        uses: eclipse-score/apt-install@main
        with:
          packages: graphviz
          cache: false

      - name: Checkout repository (Handle all events)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Setup Bazel with shared caching
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          disk-cache: true
          repository-cache: true
          bazelisk-cache: true
          cache-save: ${{ github.event_name == 'push' }}

      - name: Setup venv
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          repo="eclipse-score/docs-as-code"
          tag="v8.0.0"
          runs=10

          urls=(
            "api|https://api.github.com/repos/${repo}/tarball/${tag}"
            "github|https://github.com/${repo}/archive/refs/tags/${tag}.tar.gz"
            "codeload|https://codeload.github.com/${repo}/tar.gz/refs/tags/${tag}"
          )

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          for entry in "${urls[@]}"; do
            name="${entry%%|*}"
            url="${entry#*|}"
            result="$tmp/$name"

            echo "=== $name ==="

            for i in $(seq 1 "$runs"); do
              printf "Run %2d/%d: " "$i" "$runs"

              curl \
                --location \
                --output /dev/null \
                --silent \
                --show-error \
                --write-out '%{time_total} %{speed_download} %{http_code} %{num_redirects}\n' \
                "$url" \
                | tee -a "$result"
            done

            echo
          done

          printf "%-10s %10s %10s %10s %12s %10s\n" \
            "source" "min[s]" "avg[s]" "max[s]" "MB/s avg" "redirects"

          for entry in "${urls[@]}"; do
            name="${entry%%|*}"
            result="$tmp/$name"

            awk -v name="$name" '
              NR == 1 {
                min=$1
                max=$1
              }
              {
                sum += $1
                speed += $2

                if ($1 < min) min=$1
                if ($1 > max) max=$1

                redirects=$4
              }
              END {
                printf "%-10s %10.3f %10.3f %10.3f %12.2f %10d\n",
                  name,
                  min,
                  sum / NR,
                  max,
                  (speed / NR) / 1000000,
                  redirects
              }
            ' "$result"
          done
